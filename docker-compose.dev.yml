# Development override — hot reload without rebuilding images on every code change.
#
#   make dev          # detached, auto-reload (recommended)
#   make dev-watch    # foreground + Compose Watch (sync/rebuild on file changes)
#
# Production stays unchanged: docker compose up -d --build  (or make up)

services:
  backend:
    volumes:
      - ./backend/app:/app/backend/app
      - ./backend/alembic:/app/backend/alembic
      - ./backend/alembic.ini:/app/backend/alembic.ini:ro
      - ./fixtures:/app/fixtures:ro
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/backend/app
    environment:
      LOG_FORMAT: text
    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /app/backend/app
        - action: sync
          path: ./backend/alembic
          target: /app/backend/alembic
        - action: rebuild
          path: ./backend/Dockerfile
        - action: rebuild
          path: ./backend/pyproject.toml

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    command: ["npm", "run", "dev", "--", "-H", "0.0.0.0"]
    healthcheck:
      start_period: 90s
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./frontend/Dockerfile.dev

volumes:
  frontend_node_modules:
