services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: usefultool
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usefultool"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/usefultool
      DEMO_MODE: "true"
      ADMIN_TOKEN: dev-admin-token
      LOG_LEVEL: INFO
      FIXTURES_DIR: /app/fixtures
      FRONTEND_URL: http://localhost:3000
      LLM_ENABLED: "true"
      LLM_PROVIDER: mock
      LLM_MODEL: gpt-4o-mini
    volumes:
      - ./fixtures:/app/fixtures:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # Traefik labels (optional — uncomment when using Traefik reverse proxy):
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.gri-frontend.rule=Host(`dashboard.example.com`)"
    #   - "traefik.http.services.gri-frontend.loadbalancer.server.port=3000"

volumes:
  postgres_data:
