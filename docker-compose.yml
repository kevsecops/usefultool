services:
  postgres:
    image: postgis/postgis:16-3.4
    # Official image is amd64-only; explicit platform avoids arm64 host warnings
    platform: linux/amd64
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: usefultool
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usefultool"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Compose values override .env (localhost URLs in .env are for non-Docker dev)
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/usefultool
      DEMO_MODE: "false"
      SHOWCASE_MODE: "false"
      LOG_FORMAT: json
      NINA_FALLBACK_TO_FIXTURES: "false"
      ADMIN_TOKEN: dev-admin-token
      LOG_LEVEL: INFO
      FIXTURES_DIR: /app/fixtures
      FRONTEND_URL: http://localhost:3000
      LLM_ENABLED: "false"
      LLM_PROVIDER: mock
      LLM_MODEL: gpt-4o-mini
      SOURCES_LIVE: "nina,gdacs,noaa"
      NINA_USER_AGENT: "GlobalRiskIntelligence/1.0 (contact@example.com)"
      NINA_BASE_URL: "https://warnung.bund.de/api31"
      GDACS_BASE_URL: "https://www.gdacs.org"
      USGS_BASE_URL: "https://earthquake.usgs.gov/earthquakes/feed/v1.0"
      EONET_BASE_URL: "https://eonet.gsfc.nasa.gov/api/v3"
      NOAA_SWPC_BASE_URL: "https://services.swpc.noaa.gov/products"
      FIRMS_BASE_URL: "https://firms.modaps.eosdis.nasa.gov"
      FIRMS_USE_FIXTURES: "true"
      # Built-in scheduler handles ingest+briefing — n8n is optional (see docs/n8n-integration.md)
      SCHEDULER_ENABLED: "true"
      INGEST_INTERVAL_MINUTES: "15"
      SCHEDULER_GENERATE_BRIEFING: "true"
      AUTO_GENERATE_BRIEFING: "true"
      SCHEDULER_STARTUP_DELAY_SECONDS: "30"
    volumes:
      - ./fixtures:/app/fixtures:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Browser calls the published API port on the host
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Next.js server components / SSR use the Docker network
      API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
